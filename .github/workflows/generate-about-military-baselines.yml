name: Generate About Military Baselines

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-about-military-baselines.yml"

permissions:
  contents: write

jobs:
  generate-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate approved military timeline baselines
        run: npx playwright test tests/about-military.spec.mjs --update-snapshots

      - name: Commit generated baselines
        shell: bash
        run: |
          if git status --short tests/__screenshots__ | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/__screenshots__
            git commit -m "Add approved military timeline visual baselines"
            git push
          else
            echo "No baseline changes to commit."
          fi
