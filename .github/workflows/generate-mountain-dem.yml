name: Generate mountain DEM profiles

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_mountain_dem_profiles.py"
      - ".github/workflows/generate-mountain-dem.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow

      - name: Generate DEM profiles
        run: python scripts/generate_mountain_dem_profiles.py

      - name: Commit generated profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/mountain_dem_profiles.json assets/js/mountain-dem-profiles.js
          if git diff --cached --quiet; then
            echo "No generated profile changes."
          else
            git commit -m "Generate DEM-derived mountain profiles"
            git push
          fi
