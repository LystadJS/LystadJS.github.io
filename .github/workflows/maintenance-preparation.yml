name: Recover generated dependency lock
on:
  push:
    branches: ['chatgpt/maintenance-preparation-20261005']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bd550ec8efe92aa9170058d1adbf379c2ee82928
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Use the validated package manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,hashlib,urllib.request
          from pathlib import Path
          sha='9a658d913ae38b11790086aa3358fc8d954c3bf1'
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=60) as r: data=base64.b64decode(json.load(r)['content'])
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
          Path('package.json').write_bytes(data)
          PY
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Store lock blob; branch publication remains a connector action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,hashlib,urllib.request
          from pathlib import Path
          data=Path('package-lock.json').read_bytes(); lock=json.loads(data)
          for name in ['@playwright/test','playwright','playwright-core']:
              assert lock['packages']['node_modules/'+name]['version']=='1.57.0'
          assert lock['packages']['node_modules/axe-core']['version']=='4.10.2'
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs'
          request=urllib.request.Request(url,data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=60) as r: sha=json.load(r)['sha']
          assert sha==hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          print('LOCK_RECEIPT='+json.dumps({'path':'package-lock.json','sha':sha,'bytes':len(data)}))
          print(data.decode())
          PY
