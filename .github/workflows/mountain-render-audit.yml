name: Mountain render audit

on:
  push:
    paths:
      - ".github/workflows/mountain-render-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install browser audit dependency
        run: python -m pip install --disable-pip-version-check selenium==4.49.0

      - name: Audit deployed visualization
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          URL = "https://lystadjs.github.io/about.html?mountain-audit=1"

          def make_driver(width, height):
              options = Options()
              options.add_argument("--headless=new")
              options.add_argument("--no-sandbox")
              options.add_argument("--disable-dev-shm-usage")
              options.add_argument(f"--window-size={width},{height}")
              driver = webdriver.Chrome(options=options)
              driver.set_window_size(width, height)
              return driver

          audit_js = r"""
          const stage = document.getElementById("mountain-ascent-stage");
          const svg = document.getElementById("mountain-ascent-svg");
          const popover = document.getElementById("mountain-popover");
          const scroller = document.getElementById("mountain-ascent-scroll");
          const reliefs = [...svg.querySelectorAll(".mountain-peak-relief")];
          const waypoints = [...svg.querySelectorAll(".mountain-waypoint")];
          const data = window.MOUNTAIN_DEM_PROFILES?.profiles || {};

          function rect(el) {
            const r = el.getBoundingClientRect();
            return {
              left:r.left, right:r.right, top:r.top, bottom:r.bottom,
              width:r.width, height:r.height
            };
          }

          function keyFor(group) {
            const cls = [...group.classList].find(c => c.startsWith("mountain-peak-relief--"));
            return cls ? cls.replace("mountain-peak-relief--", "") : null;
          }

          function waypointForKey(key) {
            const name = data[key]?.name;
            if (!name) return null;
            return waypoints.find(w => (w.getAttribute("aria-label") || "").startsWith(name + ","));
          }

          function waypointXY(group) {
            if (!group) return null;
            const m = (group.getAttribute("transform") || "").match(/translate\(([-\d.]+)\s+([-\d.]+)\)/);
            return m ? {x:Number(m[1]), y:Number(m[2])} : null;
          }

          function pathApex(path) {
            const total = path.getTotalLength();
            let best = null;
            const steps = 1600;
            for (let i=0; i<=steps; i++) {
              const p = path.getPointAtLength(total * i / steps);
              if (!best || p.y < best.y) best = {x:p.x, y:p.y};
            }
            return best;
          }

          const reliefMetrics = reliefs.map(group => {
            const key = keyFor(group);
            const ridge = group.querySelector(".mountain-peak-relief-ridge");
            const wp = waypointForKey(key);
            const waypoint = waypointXY(wp);
            const apex = ridge ? pathApex(ridge) : null;
            return {
              key,
              name:data[key]?.name || key,
              rect:rect(group),
              waypoint,
              apex,
              summitDx:(waypoint && apex) ? apex.x-waypoint.x : null,
              summitDy:(waypoint && apex) ? apex.y-waypoint.y : null
            };
          });

          const overlaps = [];
          for (let i=0; i<reliefMetrics.length; i++) {
            for (let j=i+1; j<reliefMetrics.length; j++) {
              const a=reliefMetrics[i], b=reliefMetrics[j];
              const ox=Math.max(0,Math.min(a.rect.right,b.rect.right)-Math.max(a.rect.left,b.rect.left));
              const oy=Math.max(0,Math.min(a.rect.bottom,b.rect.bottom)-Math.max(a.rect.top,b.rect.top));
              if (ox>0 && oy>0) overlaps.push({
                a:a.name,b:b.name,overlapX:ox,overlapY:oy,area:ox*oy
              });
            }
          }
          overlaps.sort((a,b)=>b.area-a.area);

          const hitRects = waypoints.map(w => {
            const hit=w.querySelector(".mountain-waypoint-hit");
            return hit ? rect(hit) : null;
          }).filter(Boolean);

          return {
            viewport:{width:innerWidth,height:innerHeight},
            svg:rect(svg),
            stage:{
              ...rect(stage),
              clientWidth:stage.clientWidth,
              clientHeight:stage.clientHeight,
              overflowX:getComputedStyle(stage).overflowX,
              overflowY:getComputedStyle(stage).overflowY
            },
            scroller:{
              ...rect(scroller),
              clientWidth:scroller.clientWidth,
              clientHeight:scroller.clientHeight,
              scrollWidth:scroller.scrollWidth,
              scrollHeight:scroller.scrollHeight,
              overflowX:getComputedStyle(scroller).overflowX,
              overflowY:getComputedStyle(scroller).overflowY
            },
            reliefMetrics,
            overlaps:overlaps.slice(0,12),
            hitTarget:{
              minWidth:Math.min(...hitRects.map(r=>r.width)),
              minHeight:Math.min(...hitRects.map(r=>r.height))
            },
            popover:rect(popover)
          };
          """

          results = {}
          for label, width, height in [
              ("desktop", 1440, 1000),
              ("mobile", 390, 844),
          ]:
              driver = make_driver(width, height)
              try:
                  deadline = time.time() + 45
                  while True:
                      driver.get(URL + "&t=" + str(time.time_ns()))
                      ready = driver.execute_script(
                          "return !!document.getElementById('mountain-ascent-scroll')"
                          " && document.querySelectorAll('.mountain-waypoint').length >= 10;"
                      )
                      if ready:
                          break
                      if time.time() >= deadline:
                          raise RuntimeError("Latest mountain visualization DOM did not deploy within 45 seconds.")
                      time.sleep(2)
                  time.sleep(0.75)
                  metrics = driver.execute_script(audit_js)

                  if label == "mobile":
                      popover_check = driver.execute_script(r"""
                      const stage=document.getElementById("mountain-ascent-stage");
                      const scroller=document.getElementById("mountain-ascent-scroll");
                      const points=[...document.querySelectorAll(".mountain-waypoint")];
                      const targetTop =
                        stage.getBoundingClientRect().top + window.scrollY - 120;
                      window.scrollTo(0, Math.max(0, targetTop));
                      scroller.scrollLeft=Math.max(0,(scroller.scrollWidth-scroller.clientWidth)*0.70);
                      const sr=scroller.getBoundingClientRect();
                      const visible=points.filter(point => {
                        const r=point.getBoundingClientRect();
                        const cx=(r.left+r.right)/2;
                        return cx>=sr.left && cx<=sr.right;
                      });
                      const candidate=visible[Math.floor(visible.length/2)] || points[Math.floor(points.length*0.75)];
                      candidate.dispatchEvent(new MouseEvent("click",{bubbles:true}));
                      const p=document.getElementById("mountain-popover").getBoundingClientRect();
                      const s=stage.getBoundingClientRect();
                      return {
                        stageScrollLeft:scroller.scrollLeft,
                        open:document.getElementById("mountain-popover").classList.contains("is-open"),
                        popover:{left:p.left,right:p.right,top:p.top,bottom:p.bottom,width:p.width,height:p.height},
                        stage:{left:s.left,right:s.right,top:s.top,bottom:s.bottom},
                        insideViewport:p.left>=0 && p.right<=innerWidth && p.top>=0 && p.bottom<=innerHeight
                      };
                      """)
                      metrics["mobilePopoverCheck"] = popover_check

                  results[label] = metrics
              finally:
                  driver.quit()

          print("MOUNTAIN_AUDIT_JSON=" + json.dumps(results, separators=(",", ":")))
          PY
