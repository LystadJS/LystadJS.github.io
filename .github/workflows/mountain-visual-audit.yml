name: Mountain visual audit

on:
  push:
    paths:
      - ".github/workflows/mountain-visual-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install browser tooling
        run: python -m pip install --disable-pip-version-check selenium pillow

      - name: Capture deployed mountain composition
        run: |
          mkdir -p audit
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          URL = "https://lystadjs.github.io/about.html?mountain-visual-audit=1"

          def driver_for(width, height):
              options = Options()
              options.add_argument("--headless=new")
              options.add_argument("--no-sandbox")
              options.add_argument("--disable-dev-shm-usage")
              options.add_argument("--hide-scrollbars")
              driver = webdriver.Chrome(options=options)
              driver.set_window_size(width, height)
              return driver

          def audit(label, width, height):
              driver = driver_for(width, height)
              try:
                  driver.get(URL)
                  WebDriverWait(driver, 30).until(
                      lambda d: len(d.find_elements(By.CSS_SELECTOR, ".mountain-waypoint")) == 8
                  )
                  time.sleep(1.0)
                  stage = driver.find_element(By.ID, "mountain-ascent-stage")
                  driver.execute_script("arguments[0].scrollIntoView({block:'center'});", stage)
                  time.sleep(.4)

                  if label == "mobile":
                      scroller = driver.find_element(By.ID, "mountain-ascent-scroll")
                      driver.execute_script("arguments[0].scrollLeft=260;", scroller)
                      time.sleep(.2)

                  driver.find_element(By.ID, "mountain-ascent-svg").screenshot(f"audit/{label}.png")

                  metrics = driver.execute_script(r"""
                    const svg=document.getElementById("mountain-ascent-svg");
                    const groups=[...svg.querySelectorAll(".mountain-peak-relief")];
                    const waypoints=[...svg.querySelectorAll(".mountain-waypoint")];

                    const nameFrom = g => {
                      const t=g.querySelector("title");
                      return t ? t.textContent.split(":")[0] : "";
                    };
                    const rect = el => {
                      const r=el.getBoundingClientRect();
                      return {left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height};
                    };
                    const items=groups.map((g,i)=>({
                      name:nameFrom(g),
                      rect:rect(g),
                      className:g.getAttribute("class")
                    }));

                    const overlaps=[];
                    for(let i=0;i<items.length;i++){
                      for(let j=i+1;j<items.length;j++){
                        const a=items[i],b=items[j];
                        const ox=Math.max(0,Math.min(a.rect.right,b.rect.right)-Math.max(a.rect.left,b.rect.left));
                        const oy=Math.max(0,Math.min(a.rect.bottom,b.rect.bottom)-Math.max(a.rect.top,b.rect.top));
                        if(ox>0&&oy>0) overlaps.push({a:a.name,b:b.name,ox,oy,area:ox*oy});
                      }
                    }
                    overlaps.sort((a,b)=>b.area-a.area);

                    return {
                      svg:rect(svg),
                      items,
                      overlaps:overlaps.slice(0,20),
                      waypointCount:waypoints.length
                    };
                  """)
                  return metrics
              finally:
                  driver.quit()

          out={
              "desktop":audit("desktop",1440,1800),
              "mobile":audit("mobile",390,1200)
          }
          Path("audit/metrics.json").write_text(json.dumps(out,indent=2))
          print(json.dumps(out))
          PY

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: mountain-visual-audit
          path: audit
