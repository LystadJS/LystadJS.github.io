name: Prepare UN header objects
on:
  push:
    branches: ["chatgpt/un-header-preview-20261005"]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare reviewed files without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import os, json, base64, zlib, urllib.request, hashlib
          repo=os.environ["GITHUB_REPOSITORY"]
          is_site=repo.endswith("/LystadJS.github.io")
          base="dbb97cbd4b33705801fe6fcea24ca75d48c21e7b" if is_site else "debb23ab8fe57f2725cd259496d3b52dc28a64e5"
          endpoint="https://api.github.com/repos/"+repo+"/"
          def api(path, body=None):
              payload=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(endpoint+path, data=payload, headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"], "Accept":"application/vnd.github+json", "Content-Type":"application/json"})
              with urllib.request.urlopen(req, timeout=60) as r: return json.load(r)
          assert api("git/ref/heads/main")["object"]["sha"]==base, "Main advanced; prepare from the new head."
          base_tree=api("git/commits/"+base)["tree"]["sha"]
          tree=api("git/trees/"+base_tree+"?recursive=1")
          assert not tree.get("truncated"), "Repository tree truncated."
          entries={v["path"]:v for v in tree["tree"] if v["type"]=="blob"}
          cache={}; changed={}
          def blob(sha): return base64.b64decode(api("git/blobs/"+sha)["content"])
          def read(path):
              if path not in cache: cache[path]=blob(entries[path]["sha"])
              return cache[path]
          def text(path):return read(path).decode("utf-8")
          def put(path,value):
              data=value.encode("utf-8") if isinstance(value,str) else value
              if data!=read(path):changed[path]=data
          def branding(icon):
           return '''
          /* USUN mastheads — shared palette and existing approved seal, 2026-10-05. */
          :root{--usun-brand-gold:#C1A783;--usun-brand-navy:#062135;--usun-brand-icon:url("ICON")}
          body>header,body>main>header:first-child{color:var(--usun-brand-gold)}
          body>header .masthead .eyebrow,body>header :is(h1,h2,h3,p,a,span,strong,small,.usun-identity,.usun-department,.usun-status),body>main>header:first-child :is(h1,h2,h3,p,a,span,strong,small){color:var(--usun-brand-gold)}
          /* Directory and collection workspace: replace the boxed monograms. */
          .un-masthead .un-mark{display:block;width:72px;height:72px;flex:none;padding:0;border:0;background:none;box-shadow:none}
          .un-masthead .un-mark img{display:block;width:100%;height:100%;object-fit:contain}
          body>header .masthead{display:grid;grid-template-columns:72px minmax(0,1fr);align-items:center;gap:22px}
          body>header .masthead>div{min-width:0}
          body>header .masthead .mark{display:block;width:72px;height:72px;min-width:72px;margin:0;padding:0;border:0;box-shadow:none;background:var(--usun-brand-icon) center/contain no-repeat;color:transparent;font-size:0;line-height:0;overflow:hidden}
          body>header .masthead .mark br{display:none}
          body>header.usun-masthead .usun-seal{width:72px;height:72px;object-fit:contain;flex:none;border:0;box-shadow:none}
          /* Audit and recovery pages have a plain header rather than a masthead wrapper. */
          body>main>header:first-child,body>header:has(>h1){position:relative;background:var(--usun-brand-navy);border-bottom:4px solid #D01319;padding:26px 30px 26px 124px;min-height:124px}
          body>main>header:first-child::before,body>header:has(>h1)::before{content:"";position:absolute;left:28px;top:26px;width:72px;height:72px;background:var(--usun-brand-icon) center/contain no-repeat}
          body>main>header:first-child h1,body>header:has(>h1) h1{margin-top:0;line-height:1.18}
          body>main>header:first-child a{display:inline-block;text-underline-offset:.2em}
          @media(max-width:700px){
           .un-masthead .un-mark{width:64px;height:64px}
           body>header .masthead{grid-template-columns:64px minmax(0,1fr);gap:16px}
           body>header .masthead .mark{display:block;width:64px;height:64px;min-width:64px}
           body>header.usun-masthead .usun-seal{width:64px;height:64px}
          }
          @media(max-width:600px){
           body>main>header:first-child,body>header:has(>h1){padding:106px 20px 22px}
           body>main>header:first-child::before,body>header:has(>h1)::before{left:20px;top:22px;width:64px;height:64px}
          }
          @media print{body>header,body>main>header:first-child{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
          '''.replace('ICON',icon)
          if is_site:
              html=blob("5a7daf9e429c689f94268ec194e05f5be6f50971").decode()
              assert 'viewBox="0 0 560 366"' in html and html.count('class="project-row"')==4
              html=html.replace('aria-label="John S. Lystad home">JSL</a>', 'aria-label="John S. Lystad home"><img src="transcript-agent/reports/hlw-cuba/seal.png" width="72" height="72" alt="U.S. Mission to the United Nations"></a>')
              put("un/index.html",html.replace("un.css?v=20261005-2","un.css?v=20261005-3"))
              css=zlib.decompress(base64.b64decode(""))
              assert hashlib.sha1(b"blob "+str(len(css)).encode()+b"\0"+css).hexdigest()=="c7904879f8e64ebd614a84af2ccd7d9515779860"
              put("un/un.css",css.decode().rstrip()+"\n"+branding("transcript-agent/reports/hlw-cuba/seal.png"))
              paths={"un/transcript-agent/theme.css":"reports/hlw-cuba/seal.png", "un/transcript-agent/analysis.css":"reports/hlw-cuba/seal.png", "un/transcript-agent/reports/hlw-cuba/usun-theme.css":"seal.png"}
              audit="un/transcript-agent/passage-audit.html"
          else:
              paths={"site/theme.css":"reports/hlw-cuba/seal.png", "site/analysis.css":"reports/hlw-cuba/seal.png", "reports/hlw-cuba/usun-theme.css":"seal.png"}
              audit="site/passage-audit.html"
          for path,icon in paths.items():
              put(path,text(path).replace("\r\n","\n").rstrip()+"\n"+branding(icon))
          link=b'<link rel="stylesheet" href="theme.css?v=usun-gold-20261005">'
          assert link not in read(audit)
          put(audit,read(audit).replace(b"</title>",b"</title>"+link,1))
          if is_site:
              path="un/transcript-agent/mirror-manifest.json";manifest=json.loads(text(path))
              for p in [*paths,audit]:manifest["files"][p.removeprefix("un/transcript-agent/")]=hashlib.sha256(changed[p]).hexdigest()
              put(path,json.dumps(manifest,indent=2)+"\n")
              path="un/README.md";s=text(path).replace("The hub uses the main portfolio stylesheet. The Transcript Agent retains its own\nreview interface and report styling.", "The hub uses the Transcript Agent palette and its own portfolio layout. All seven\nUN pages use the existing USUN seal and gold (#C1A783) masthead lettering. The\nTranscript Agent retains its review interface and report styling.")
              s+="\nHeader styling is embedded in `un.css`, the agent's `theme.css` and `analysis.css`,\nand the HLW report's `usun-theme.css`. The complete `analysis.css` is retained\nbecause standalone report downloads embed it. Reuse the existing seal; do not\nreplace it with a text monogram. Keep source-repository styles synchronized before\nrefreshing the public mirror.\n"
              put(path,s.replace("\r\n","\n"))
          else:
              # Preserve the stylesheet link when the audit page is regenerated.
              anchor='<title>Passage composition comparison · UN Transcript Agent</title>'
              for path in entries:
                  if path.startswith("tools/") and "passage" in path.lower() and path.endswith(".py"):
                      original=text(path)
                      if anchor in original and link.decode() not in original:
                          put(path,original.replace(anchor,anchor+link.decode()))
          rows=[];receipt=[]
          for path,data in sorted(changed.items()):
              sha=api("git/blobs",{"content":base64.b64encode(data).decode(),"encoding":"base64"})["sha"]
              assert sha==hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
              rows.append({"path":path,"mode":"100644","type":"blob","sha":sha})
              receipt.append({"path":path,"sha":sha,"bytes":len(data)})
          result=api("git/trees",{"base_tree":base_tree,"tree":rows})
          # This prepares unreachable Git objects only. The connector publishes after hash review.
          print("UN_HEADER_RECEIPT="+json.dumps({"repository":repo,"base":base,"tree":result["sha"],"files":receipt}))
          PYTHON
