name: Audit UN public mirror
on:
  push:
    branches: [main, feat/un-quick-reader-mirror]
    paths: ['un/transcript-agent/**', '.github/workflows/un-mirror-audit.yml']
  pull_request:
    paths: ['un/transcript-agent/**', '.github/workflows/un-mirror-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: website
      - uses: actions/checkout@v4
        with:
          repository: LystadJS/UNGA81-Transcript-Agent
          ref: dd5ebdad0c50ccb36ba79b895d76b91b47f06288
          path: source
          persist-credentials: false
      - name: Verify manifest hashes before synchronization
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('website/un/transcript-agent')
          manifest=json.loads((root/'mirror-manifest.json').read_text())
          assert manifest['source_repository']=='https://github.com/LystadJS/UNGA81-Transcript-Agent'
          assert list(manifest['files'])==sorted(manifest['files']), 'Manifest ordering drift'
          for path,digest in manifest['files'].items():
              target=root/path
              assert target.is_file() and not target.is_symlink(),path
              assert hashlib.sha256(target.read_bytes()).hexdigest()==digest,path
          assert 'meeting-quick-reader.js' in manifest['files']
          # Research release is an explicit allowlist of synthetic-only browser
          # assets; no source work, model weights, tests or hidden review data.
          for name in (
              'research.html','research-wiring.js','research-wiring.css',
              'parallel/w05-browser/experimental/method-lab/index.html',
              'parallel/w05-browser/experimental/method-lab/worker.js',
              'parallel/w05-browser/experimental/method-lab/fixtures/synthetic-contract.json',
              'experimental/evidence-viz/index.html',
              'experimental/evidence-viz/evidence-viz.js',
          ):
              assert name in manifest['files'],name
          for excluded in (
              'experimental/evidence-viz/tests.cjs',
              'experimental/evidence-viz/browser_smoke.py',
              'parallel/w05-browser/experimental/method-lab/test-browser.cjs',
              'parallel/w05-browser/experimental/method-lab/ACCEPTANCE.md',
          ):
              assert excluded not in manifest['files'],excluded
          release=json.loads((root/'release.json').read_text())
          assert release['browser_engine']=='browser-descriptive-1.12.2'
          assert release['D1_publication_gates_changed'] is False
          assert release['research_browser']['status']=='released_synthetic_research_preview'
          assert release['research_browser']['empirical_validation']=='not_run'
          assert release['research_browser']['heldout_37_meetings_opened'] is False
          print(json.dumps({'manifest_files':len(manifest['files']),'verified':True}))
          PY
      - name: Execute canonical source-to-mirror sync and require idempotence
        run: |
          python3 website/scripts/sync_un_project.py source | tee mirror-sync.json
          python3 - <<'PY'
          import json
          data=json.load(open('mirror-sync.json'))
          assert data['copied']==0 and data['removed']==0,data
          print(json.dumps({'status':'PASS','public_files':data['public_files'],'copied':data['copied'],'removed':data['removed']}))
          PY
          git -C website diff --exit-code -- un/transcript-agent
      - uses: actions/upload-artifact@v4
        with:
          name: meeting-quick-reader-mirror-validation
          path: mirror-sync.json
